services:
  server:
    build: ./server
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      DATABASE_PATH: /app/data/qamarflow.db
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
    volumes:
      - qamarflow-data:/app/data
    restart: unless-stopped
  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
volumes:
  qamarflow-data:
